<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ark Secure — Joseph Cilenti's terminal-style networking hub for cybersecurity, Linux, networking, software, AI, radio, and maker projects.">
  <meta name="theme-color" content="#0b0f18">
  <title>Ark Secure // Terminal</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <a class="skip-link" href="#terminal-input">Skip to terminal</a>
  <div class="noise" aria-hidden="true"></div>
  <main class="shell" aria-label="Ark Secure interactive terminal">
    <header class="window-bar">
      <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="window-title">guest@arksecure: ~/network</div>
      <button id="mobile-help" class="utility-button" type="button">commands</button>
    </header>

    <section id="terminal" class="terminal" role="log" aria-live="polite" aria-label="Terminal output">
      <div id="output"></div>
      <form id="terminal-form" class="prompt-line" autocomplete="off">
        <label class="sr-only" for="terminal-input">Enter a command</label>
        <span class="prompt-user">guest@arksecure</span><span class="prompt-separator">:</span><span class="prompt-path">~</span><span class="prompt-symbol">$</span>
        <input id="terminal-input" name="command" type="text" inputmode="text" autocapitalize="none" spellcheck="false" aria-describedby="input-hint" autofocus>
      </form>
      <p id="input-hint" class="sr-only">Type help to view available commands. Use up and down arrows for command history.</p>
    </section>

    <footer class="status-bar">
      <span><span class="status-dot"></span> ONLINE</span>
      <span>ARK SECURE // YOUR DIGITAL REFUGE</span>
      <span id="clock" aria-label="Current local time"></span>
    </footer>
  </main>
  <noscript><p class="noscript">JavaScript is required for the interactive terminal. Visit <a href="about.html">About</a> or <a href="projects.html">Projects</a>.</p></noscript>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/terminal.js"></script>
</body>
</html>
